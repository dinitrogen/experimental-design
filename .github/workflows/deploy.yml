# Deploy to Firebase Hosting and Functions on every merge to main.
#
# ── Required GitHub Secrets ──────────────────────────────────────────────────
#
#  FIREBASE_CONFIG  (required for the Angular app to connect to Firebase)
#    The Firebase web app configuration object as a JSON literal (without quotes
#    around the outer object).  Copy it from the Firebase console:
#      1. Firebase console → Project settings → Your apps → Web app.
#      2. Under "SDK setup and configuration", choose "Config".
#      3. Copy only the object literal assigned to `firebaseConfig` – it looks like:
#           { apiKey: "…", authDomain: "…", projectId: "…", … }
#    How to add it:
#      GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#      Name: FIREBASE_CONFIG   Value: <paste the object literal>
#
#  FIREBASE_PROJECT_ID
#    Your Firebase project ID (e.g. "my-app-12345").
#    Where to find it:
#      1. Open the Firebase console → https://console.firebase.google.com
#      2. Select your project.
#      3. Click the gear icon (⚙) → Project settings.
#      4. Copy the "Project ID" shown on the General tab.
#    How to add it:
#      GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#      Name: FIREBASE_PROJECT_ID   Value: <your project ID>
#
#  FIREBASE_TOKEN  (required to authenticate the Firebase CLI for deployment)
#    A long-lived Firebase CI token.  Unlike a service-account key this token
#    acts on behalf of a real Google user and therefore already carries the
#    "Service Account User" IAM binding that Cloud Functions deployment
#    requires (iam.serviceAccounts.ActAs on the App Engine default SA).
#    How to generate it:
#      1. On your local machine, install the Firebase CLI:
#           npm install -g firebase-tools
#      2. Run:
#           firebase login:ci
#      3. A browser window opens – sign in with a Google account that is a
#         Firebase project Owner or Editor for your project.
#      4. Copy the token that is printed in the terminal.
#    How to add it:
#      GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#      Name: FIREBASE_TOKEN   Value: <paste the token>
#
#  GOOGLE_GENAI_API_KEY  (required for Cloud Functions to call the Gemini API)
#    Your Google Generative AI (Gemini) API key used by the Cloud Functions.
#    Where to find it:
#      1. Open Google AI Studio → https://aistudio.google.com/app/apikey
#      2. Copy an existing key or create a new one.
#    How to add it:
#      GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#      Name: GOOGLE_GENAI_API_KEY   Value: <your API key>
#
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Write Angular environment file
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          printf 'export const environment = {\n  production: true,\n  useEmulators: false,\n  firebase: %s,\n};\n' "$FIREBASE_CONFIG" > src/environments/environment.prod.ts

      - name: Build Angular app
        run: npm run build

      - name: Install Cloud Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build Cloud Functions
        run: npm run build
        working-directory: functions

      - name: Write Functions environment file
        run: echo "GOOGLE_GENAI_API_KEY=${{ secrets.GOOGLE_GENAI_API_KEY }}" > functions/.env

      - name: Deploy to Firebase (hosting + functions)
        run: |
          npx firebase-tools deploy \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --only hosting,functions \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --non-interactive

