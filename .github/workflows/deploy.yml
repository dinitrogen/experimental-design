# Deploy to Firebase Hosting only on every merge to main.
# Cloud Functions are not deployed in this workflow.
#
# ── Required GitHub Secrets ──────────────────────────────────────────────────
#
#  FIREBASE_CONFIG  (required for the Angular app to connect to Firebase)
#    The Firebase web app configuration object as a JSON literal (without quotes
#    around the outer object).  Copy it from the Firebase console:
#      1. Firebase console → Project settings → Your apps → Web app.
#      2. Under "SDK setup and configuration", choose "Config".
#      3. Copy only the object literal assigned to `firebaseConfig` – it looks like:
#           { apiKey: "…", authDomain: "…", projectId: "…", … }
#    How to add it:
#      GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#      Name: FIREBASE_CONFIG   Value: <paste the object literal>
#
#  FIREBASE_PROJECT_ID
#    Your Firebase project ID (e.g. "my-app-12345").
#    Where to find it:
#      1. Open the Firebase console → https://console.firebase.google.com
#      2. Select your project.
#      3. Click the gear icon (⚙) → Project settings.
#      4. Copy the "Project ID" shown on the General tab.
#    How to add it:
#      GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#      Name: FIREBASE_PROJECT_ID   Value: <your project ID>
#
#  FIREBASE_SERVICE_ACCOUNT
#    A JSON service-account key with permission to deploy.
#    Where to find / create it:
#      1. Firebase console → Project settings → Service accounts tab.
#      2. Click "Generate new private key" and confirm.
#      3. A .json file is downloaded — copy the entire file contents.
#    How to add it:
#      GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#      Name: FIREBASE_SERVICE_ACCOUNT   Value: <paste the entire JSON>
#
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy Hosting
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Write Angular environment file
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          printf 'export const environment = {\n  production: true,\n  useEmulators: false,\n  firebase: %s,\n};\n' "$FIREBASE_CONFIG" > src/environments/environment.prod.ts

      - name: Build Angular app
        run: npm run build

      - name: Deploy to Firebase (hosting only)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-sa.json
          npx firebase-tools deploy \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --only hosting \
            --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json

